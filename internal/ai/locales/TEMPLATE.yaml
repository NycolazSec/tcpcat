  chk-wings-auth: ""
  # en: : 
  # fr:  : 
  colon: ""
  # en: %d closed (RST)
  # fr: %d fermé(s) (RST)
  count-closed: ""
  # en: %d dropped silently
  # fr: %d filtré(s) en silence
  count-dropped: ""
  # en: %d open
  # fr: %d ouvert(s)
  count-open: ""
  # en: %d rejected (ICMP)
  # fr: %d refusé(s) par ICMP
  count-rejected: ""
  # en: Port %d: the service sent its banner after %s; service detection only waits half a second. The banner is now part of the analysis.
  # fr: Port %d : le service a envoyé sa bannière au bout de %s, alors que la détection de service n'attend qu'une demi-seconde. La bannière est maintenant prise en compte.
  diag-banner-late: ""
  # en: Port %d: no banner even after %s, though %s speaks first: something holds the connection (an anti-DDoS, a SYN proxy, a tarpit), or it is not %s.
  # fr: Port %d : aucune bannière même après %s, alors que %s parle en premier : quelque chose retient la connexion (anti-DDoS, proxy SYN, piège à robots), ou ce n'est pas du %s.
  diag-banner-none: ""
  # en: waiting for the silent services of %s to speak…
  # fr: j'attends que les services muets de %s parlent…
  diag-banner-wait: ""
  # en: %s answers a single slow connection on port %d: it is the pace of the scan that got blocked, not your address for good. Scan more slowly (--rate 50 -T2), or add your address to the protection's allow list.
  # fr: %s répond à une connexion isolée sur le port %d : c'est le rythme du scan qui a été bloqué, pas votre adresse pour de bon. Scannez plus lentement (--rate 50 -T2), ou ajoutez votre adresse à la liste blanche de la protection.
  diag-blind-answers: ""
  # en: %s answers a single slow connection on port %d: the pace of the scan got blocked, not your address for good. The block may come from the machine's protection, or from your own router, which a scan from behind a home box can fill up: scan again with fewer connections at once (-w 16 --rate 50) before suspecting the machine.
  # fr: %s répond à une connexion isolée sur le port %d : c'est le rythme du scan qui a été bloqué, pas votre adresse pour de bon. Le blocage peut venir de la protection de la machine, ou de votre propre box, qu'un scan depuis chez vous peut saturer : relancez avec moins de connexions à la fois (-w 16 --rate 50) avant de soupçonner la machine.
  diag-blind-answers-nat: ""
  # en: %s: nothing answers, not even one slow connection, nor after a %d s pause. The machine is off, or your address is blocked entirely: check from another connection, and look at the machine's protection (fail2ban, CrowdSec, anti-DDoS).
  # fr: %s : rien ne répond, ni à une connexion isolée, ni après %d s de pause. La machine est éteinte, ou votre adresse est entièrement bloquée : vérifiez depuis une autre connexion, et regardez la protection de la machine (fail2ban, CrowdSec, anti-DDoS).
  diag-blind-dead: ""
  # en: Or your own router ran out of room for the scan's connections: from behind a home box, it looks the same.
  # fr: Ou bien votre propre box a manqué de place pour les connexions du scan : derrière une box, cela se présente de la même façon.
  diag-blocked-nat: ""
  # en: %s: ports %s answered during the scan and no longer do. The machine, or its protection (fail2ban, CrowdSec, an anti-DDoS...), blocked your address during the scan.
  # fr: %s : les ports %s répondaient pendant le scan et ne répondent plus. La machine, ou sa protection (fail2ban, CrowdSec, un anti-DDoS…), a bloqué votre adresse pendant le scan.
  diag-blocked-now: ""
  # en: You scan from behind a router (a private address): after a fast scan, it can keep refusing connections to this machine for a few minutes. Check from another connection (a phone's hotspot) before blaming the machine.
  # fr: Vous scannez derrière une box (adresse privée) : après un scan rapide, elle peut refuser les connexions vers cette machine pendant quelques minutes. Vérifiez depuis une autre connexion (le partage de connexion d'un téléphone) avant d'accuser la machine.
