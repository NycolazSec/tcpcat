  # en: checking that %s still answers…
  # fr: je vérifie que %s répond toujours…
  diag-recheck: ""
  # en: trying %s again, one slow connection at a time…
  # fr: je réessaie %s, une connexion lente à la fois…
  diag-slow-probe: ""
  # en: For SSH, the usual causes are UseDNS yes, a MaxStartups limit, or an anti-DDoS holding new connections back.
  # fr: Pour SSH, les causes habituelles sont UseDNS yes, une limite MaxStartups, ou un anti-DDoS qui retient les nouvelles connexions.
  diag-ssh-slow-hint: ""
  # en: Still blocked after %d s: a ban, not a slowdown. Unblock your address in the machine's protection (fail2ban, CrowdSec, anti-DDoS), and add it to its allow list before scanning again.
  # fr: Toujours bloqué après %d s : c'est un bannissement, pas un ralentissement. Débloquez votre adresse dans la protection de la machine (fail2ban, CrowdSec, anti-DDoS), et ajoutez-la à sa liste blanche avant de rescanner.
  diag-still-blocked: ""
  # en: %s: the ports that were open still answer after the scan, so nothing blocked your address.
  # fr: %s : les ports ouverts répondent toujours après le scan, rien n'a bloqué votre adresse.
  diag-still-open: ""
  # en: Port %d trickles random lines instead of an SSH banner (the first after %s): an SSH tarpit such as endlessh, a trap that holds bots for hours. The real SSH server, if any, listens elsewhere.
  # fr: Le port %d distille des lignes au hasard au lieu d'une bannière SSH (la première au bout de %s) : un piège à SSH (tarpit, comme endlessh) qui retient les robots pendant des heures. Le vrai serveur SSH, s'il existe, écoute ailleurs.
  diag-tarpit: ""
  # en: After %d s, port %d answers again: a temporary limit, triggered by the pace of the scan. Scan more slowly (--rate 50 -T2), or add your address to the protection's allow list.
  # fr: Après %d s, le port %d répond de nouveau : c'est une limitation temporaire, déclenchée par le rythme du scan. Scannez plus lentement (--rate 50 -T2), ou ajoutez votre adresse à la liste blanche de la protection.
  diag-unblocked: ""
  # en: After %d s, port %d answers again: a temporary limit, triggered by the pace of the scan. It may come from the machine's protection, or from your own router, which a scan from behind a home box can fill up: scan again with fewer connections at once (-w 16 --rate 50) before suspecting the machine.
  # fr: Après %d s, le port %d répond de nouveau : c'est une limitation temporaire, déclenchée par le rythme du scan. Elle peut venir de la protection de la machine, ou de votre propre box, qu'un scan depuis chez vous peut saturer : relancez avec moins de connexions à la fois (-w 16 --rate 50) avant de soupçonner la machine.
  diag-unblocked-nat: ""
  # en: waiting %d s to see whether the block lifts…
  # fr: j'attends %d s pour voir si le blocage se lève…
  diag-wait: ""
  # en: seen from your address only: if the firewall has it on an allow list, this port may be open for you alone. Check from another connection before closing it
  # fr: vu depuis votre seule adresse : si elle est sur une liste blanche du pare-feu, ce port n'est peut-être ouvert que pour vous. Revérifiez depuis une autre connexion avant de le fermer
  ev-allowlist: ""
  # en: this port is also used by: %s
  # fr: ce port sert aussi à : %s
  ev-alt: ""
  # en: the follow-up check got an answer in %s once the block lifted: the block, not the service, had cut service detection short
