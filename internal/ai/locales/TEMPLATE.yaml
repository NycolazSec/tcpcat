# The starting point of a translation of tcpcat's AI. Copy this file to
# <code>.yaml in this directory (es.yaml, de.yaml, pt-BR.yaml...), translate
# what you can, and open a pull request: see README.md here. Any text left
# empty is shown in English, so a partial translation is welcome.
#
# Keep every %d, %s, %.0f... : tcpcat puts numbers and names there. You may
# move them; to change their order, write %[2]s for the second one, and so
# on. Write %% for a percent sign.
#
# Generated by: go run ./internal/ai/localetool template

name: "" # the language's name, in that language
decimal: "." # decimal mark: "." or ","
thousands: "," # between groups of three digits: ",", ".", " " or "none"
percent: "%s%%" # a percentage, %s is the number: "%s%%" or "%s %%"

# What the AI says about each port and each scan (internal/ai).
messages:
  # en: %s: all %d ports tested are filtered. Either the machine is off, or it (or a firewall on the way) is ignoring your address, for instance after spotting the scan, or it only opens to a VPN or after a port-knocking sequence. This scan cannot tell what the machine exposes: check again from another connection (a phone's hotspot, for instance).
  # fr: %s : les %d ports testés sont tous filtrés. Soit la machine est éteinte, soit elle (ou un pare-feu sur le chemin) ignore votre adresse, par exemple après avoir repéré le scan, soit elle ne s'ouvre qu'à un VPN ou après une séquence de port-knocking. Ce scan ne permet pas de savoir ce qu'elle expose : revérifiez depuis une autre connexion (le partage de connexion d'un téléphone, par exemple).
  alert-blind: ""
  # en: You scan from behind a router (a private address): a scan that is too fast can fill its connection table, and it then drops the scan's connections, which gives exactly this result. Scan again with fewer connections at once (-w 16).
  # fr: Vous scannez derrière une box (adresse privée) : un scan trop rapide peut remplir sa table de connexions, et elle jette alors celles du scan, ce qui donne exactement ce résultat. Relancez avec moins de connexions à la fois (-w 16).
  alert-blind-nat: ""
  # en: This scan runs from a Kubernetes node. The cluster's firewall may trust this machine and let it reach ports that are closed to the internet: check the cluster ports again from a machine outside the cluster before acting.
  # fr: Ce scan part d'un nœud Kubernetes. Le pare-feu du cluster fait peut-être confiance à cette machine et lui ouvre des ports fermés à Internet : revérifiez les ports du cluster depuis une machine extérieure au cluster avant d'agir.
  alert-cluster-node: ""
  # en: %s: its %d open ports accept connections, but no service answered on any of them. Something on the way (an anti-DDoS, a SYN proxy, a firewall) may be answering for the machine, or cutting the exchange short: what follows rests on the port numbers alone.
  # fr: %s : ses %d ports ouverts acceptent la connexion, mais aucun service n'a répondu. Un équipement sur le chemin (anti-DDoS, proxy SYN, pare-feu) répond peut-être à la place de la machine, ou coupe l'échange : ce qui suit repose sur les seuls numéros de port.
  alert-mute: ""
