  title-vuln: ""
  # en: %s has known flaws to patch
  # fr: %s a des failles connues à corriger
  title-vuln-medium: ""
  # en:  (to be confirmed)
  # fr:  (à confirmer)
  to-confirm: ""
  # en: A reply much faster than the host's other replies cannot have travelled to the host and back; a router, firewall or proxy on the path answered instead (FTP helpers on home routers do this).
  # fr: Une réponse bien plus rapide que les autres n'a pas pu faire l'aller-retour jusqu'à la machine ; un routeur, un pare-feu ou un proxy sur le chemin a répondu à sa place (les assistants FTP des box font cela).
  why-middlebox: ""
  # en: Neither the probes, the model nor the dictionary could name it: something listens there that you may not know about.
  # fr: Ni les sondes, ni le modèle, ni le dictionnaire n'ont pu l'identifier : quelque chose écoute là, peut-être à votre insu.
  why-unknown: ""
  # en: A known flaw of this version is rated %s out of 10.
  # fr: Une faille connue de cette version est notée %s sur 10.
  why-vuln: ""

