  # fr: Les ports fermés répondent directement par un RST : rien ne les filtre, ou un pare-feu les refuse par un RST, ce qui revient au même vu de l'extérieur. Les jeter en silence en dirait moins à un scanner.
  story-no-firewall: ""
  # en: A firewall drops most ports, but some get through to the machine with nothing listening behind them (closed: %s): opening rules left behind, or services that are stopped.
  # fr: Un pare-feu jette la plupart des ports, mais certains passent jusqu'à la machine sans que rien n'y écoute (fermés : %s) : des règles d'ouverture oubliées, ou des services arrêtés.
  story-partial: ""
  # en: A firewall refuses some ports out loud (%s): it answers with an ICMP error instead of keeping quiet.
  # fr: Un pare-feu refuse certains ports ouvertement (%s) : il répond par une erreur ICMP au lieu de se taire.
  story-reject: ""
  # en: The open ports took up to %s ms to answer, close to the %s ms timeout: some "filtered" ports may only be slow. Scan again with -T2 for a longer timeout.
  # fr: Les ports ouverts ont mis jusqu'à %s ms à répondre, près du délai de %s ms : certains ports « filtrés » sont peut-être seulement lents. Relancez avec -T2 pour un délai plus long.
  story-slow: ""
  # en: Port 25 answers closed while most ports are filtered: many internet providers block outgoing mail (port 25) and answer in the machine's place. Check it from another connection before drawing conclusions.
  # fr: Le port 25 répond fermé alors que la plupart des ports sont filtrés : beaucoup de fournisseurs d'accès bloquent l'envoi de mail (port 25) et répondent à la place de la machine. Vérifiez-le depuis une autre connexion avant d'en conclure quoi que ce soit.
  story-smtp-isp: ""
  # en: A firewall lets only the open ports through and drops everything else silently: the right setup.
  # fr: Un pare-feu ne laisse passer que les ports ouverts et jette tout le reste en silence : c'est la bonne configuration.
  story-whitelist: ""
  # en: %d to fix, %d to review, %d as expected.
  # fr: %d à corriger, %d à vérifier, %d normaux.
  summary: ""
  # en: %s is reachable from this network
  # fr: %s est joignable depuis ce réseau
  title-internal: ""
  # en: %s is reachable from this network: make sure it requires a login
  # fr: %s est joignable depuis ce réseau : vérifiez qu'il exige une authentification
  title-internal-check: ""
  # en: %s is reachable from this network and refuses anonymous clients
  # fr: %s est joignable depuis ce réseau et refuse les clients anonymes
  title-internal-verified: ""
  # en: %s has a vulnerability exploited in the wild
  # fr: %s a une faille exploitée par des attaquants
  title-kev: ""
  # en: Port %d: the answer probably comes from your own network, not from this host
  # fr: Port %d : la réponse vient probablement de votre propre réseau, pas de cette machine
  title-middlebox: ""
  # en: %s is reachable from the internet
  # fr: %s est joignable depuis Internet
  title-private: ""
  # en: %s is public, as expected
  # fr: %s est public, c'est normal
  title-public: ""
  # en: %s is reachable from the internet: limit who can reach it
  # fr: %s est joignable depuis Internet : limitez qui peut l'atteindre
  title-restricted: ""
  # en: Unknown service on port %d
