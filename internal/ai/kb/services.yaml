# tcpcat's dictionary of network services.
#
# One entry per service (a protocol such as "ssh") or product (a daemon such as
# "openssh", with `parent: ssh`). An entry inherits every field it leaves empty
# from its parent, so groups of services share their text: `abstract` entries
# exist only to be inherited from and are never reported themselves.
#
#   exposure  what is acceptable from the internet:
#               public      meant to be reachable by anyone (a website, a game)
#               restricted  may be reachable, better limited to known addresses
#               private     should never be reachable from the internet
#   risk      how bad it is when a private/restricted service is reachable
#             from the internet: info, low, medium, high, critical
#   insecure  the protocol itself sends credentials or data in clear text
#   products  product names (as Rapid7 Recog and tcpcat's detector write
#             them) that identify this entry; matched case-insensitively
#   banners   real-looking banners, as tcpcat stores them, used as extra
#             training examples for the banner model
#
# Statements here must stay factual and checkable: they are shown to users
# as the reason behind a finding.
version: 1
services:

  # ------------------------------------------------------------------ groups
  - id: database
    abstract: true
    category: database
    exposure: private
    risk: high
    why:
      en: Anyone on the internet can try passwords against it, use any unpatched flaw, and reach your data directly.
      fr: N'importe qui sur Internet peut essayer des mots de passe, exploiter une faille non corrigée et atteindre directement vos données.
    hint:
      en: Applications on the same machine or network reach it without the internet; for remote administration use an SSH tunnel or a VPN.
      fr: Les applications de la même machine ou du même réseau y accèdent sans passer par Internet ; pour l'administrer à distance, utilisez un tunnel SSH ou un VPN.

  - id: queue
    abstract: true
    category: messaging
    exposure: private
    risk: high
    why:
      en: Message brokers often accept connections without authentication by default; anyone could read or inject messages.
      fr: Les courtiers de messages acceptent souvent des connexions sans authentification par défaut ; n'importe qui pourrait lire ou injecter des messages.

  - id: cluster
    abstract: true
    category: orchestration
    exposure: private
    risk: critical
    why:
      en: This is the control plane of your containers or cluster; access to it usually means control of every workload.
      fr: C'est le cœur de commande de vos conteneurs ou de votre cluster ; y accéder revient généralement à contrôler toutes les applications.
    hint:
      en: Cluster ports only need to be reachable between nodes; restrict them to the node addresses or the private network.
      fr: Les ports du cluster n'ont besoin d'être joignables qu'entre les nœuds ; limitez-les aux adresses des nœuds ou au réseau privé.

  - id: monitoring
    abstract: true
    category: monitoring
    exposure: private
    risk: medium
    why:
      en: It reveals the inside of your infrastructure (hosts, versions, metrics) and often has no login at all.
      fr: Il révèle l'intérieur de votre infrastructure (machines, versions, métriques) et n'a souvent aucune authentification.

  - id: windows-network
    abstract: true
    category: windows
    exposure: private
    risk: high
    why:
      en: Windows network services are a favourite target of worms and ransomware; they are meant for the local network only.
      fr: Les services réseau Windows sont une cible favorite des vers et des rançongiciels ; ils sont faits pour le réseau local uniquement.

  - id: industrial
    abstract: true
    category: industrial
    exposure: private
    risk: critical
    insecure: true
    why:
      en: Industrial protocols have no authentication; anyone who reaches the port can read or change the state of physical equipment.
      fr: Les protocoles industriels n'ont pas d'authentification ; quiconque atteint le port peut lire ou modifier l'état d'équipements physiques.
    hint:
      en: Keep control networks isolated from the internet; remote access goes through a VPN and a monitored jump host.
      fr: Gardez les réseaux de contrôle isolés d'Internet ; l'accès distant passe par un VPN et une machine de rebond surveillée.

  - id: admin-web
    abstract: true
    category: administration
    exposure: private
    risk: high
    why:
      en: An administration interface on the internet gets constant password-guessing, and one flaw in it gives control of the server.
      fr: Une interface d'administration sur Internet subit des essais de mots de passe en continu, et une seule faille donne le contrôle du serveur.

  # ---------------------------------------------------------- remote access
  - id: ssh
    name: SSH
    category: remote-access
    ports: [22]
    exposure: restricted
    risk: low
    what:
      en: Remote shell access to the machine.
      fr: Accès distant en ligne de commande à la machine.
    why:
      en: SSH on the internet is fine when well configured, but it is probed by password-guessing bots all day long.
      fr: SSH sur Internet est acceptable s'il est bien configuré, mais des robots y essaient des mots de passe en permanence.
    hint:
      en: Allow only key-based login (PasswordAuthentication no), disable root login, and if you can, allow only known addresses.
      fr: N'autorisez que la connexion par clé (PasswordAuthentication no), interdisez root, et si possible n'acceptez que des adresses connues.
    banners: [SSH-2.0-Go, SSH-2.0-SSHD, SSH-2.0-paramiko_3.4.0]
  - id: openssh
    name: OpenSSH
    parent: ssh
    products: [openssh]
    banners: [SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5, SSH-2.0-OpenSSH_10.0p2 Debian-7, SSH-2.0-OpenSSH_8.7]
  - id: dropbear
    name: Dropbear SSH
    parent: ssh
    products: [dropbear, dropbear ssh, dropbear_ssh]
    banners: [SSH-2.0-dropbear_2022.83]
  - id: libssh
    name: libssh
    parent: ssh
    products: [libssh]

  - id: telnet
    name: Telnet
    category: remote-access
    ports: [23, 2323]
    exposure: private
    risk: critical
    insecure: true
    what:
      en: Old remote login protocol, often found on routers, cameras and IoT devices.
      fr: Ancien protocole de connexion distante, fréquent sur les routeurs, caméras et objets connectés.
    why:
      en: Telnet sends passwords in clear text and is the main way botnets such as Mirai take over devices.
      fr: Telnet envoie les mots de passe en clair et c'est la porte d'entrée principale des botnets comme Mirai.
    hint:
      en: Turn Telnet off and use SSH instead.
      fr: Désactivez Telnet et utilisez SSH à la place.

  - id: rdp
    name: Remote Desktop (RDP)
    name_fr: Bureau à distance (RDP)
    category: remote-access
    ports: [3389]
    aliases: [ms-wbt-server, rdp]
    exposure: private
    risk: high
    what:
      en: Windows remote desktop.
      fr: Bureau à distance Windows.
    why:
      en: Exposed RDP is one of the most common entry points for ransomware, through password-guessing and flaws such as BlueKeep.
      fr: Un RDP exposé est l'une des entrées les plus fréquentes des rançongiciels, par essais de mots de passe et failles comme BlueKeep.
    hint:
      en: Put RDP behind a VPN or a Remote Desktop Gateway, and require Network Level Authentication.
      fr: Placez RDP derrière un VPN ou une passerelle Bureau à distance, et exigez l'authentification au niveau du réseau (NLA).

  - id: vnc
    name: VNC
    category: remote-access
    ports: [5900, 5901, 5800]
    exposure: private
    risk: high
    what:
      en: Remote screen sharing.
      fr: Partage d'écran à distance.
    why:
      en: VNC passwords are short and often missing, and the screen and keyboard travel unencrypted.
      fr: Les mots de passe VNC sont courts, souvent absents, et l'écran comme le clavier circulent sans chiffrement.
    hint:
      en: Reach VNC through an SSH tunnel or a VPN only.
      fr: N'accédez à VNC qu'à travers un tunnel SSH ou un VPN.
    banners: ["RFB 003.008", "RFB 003.003"]

  - id: x11
    name: X11
    category: remote-access
    ports: [6000, 6001]
    exposure: private
    risk: critical
    insecure: true
    what:
      en: X Window display server.
      fr: Serveur d'affichage X Window.
    why:
      en: An open X server lets anyone capture the screen and every keystroke.
      fr: Un serveur X ouvert permet à n'importe qui de capturer l'écran et chaque frappe au clavier.
    hint:
      en: Start X with -nolisten tcp and use ssh -X for remote applications.
      fr: Lancez X avec -nolisten tcp et utilisez ssh -X pour les applications distantes.

  - id: winrm
    name: WinRM
    parent: windows-network
    ports: [5985, 5986]
    what:
      en: Windows remote management (PowerShell remoting).
      fr: Administration à distance de Windows (PowerShell à distance).

  # ------------------------------------------------------------- file sharing
  - id: ftp
    name: FTP
    category: file-transfer
    ports: [21]
    exposure: restricted
    risk: medium
    insecure: true
    what:
      en: File transfer server.
      fr: Serveur de transfert de fichiers.
    why:
      en: FTP sends logins and files in clear text, and anonymous access is often left on by mistake.
      fr: FTP transmet identifiants et fichiers en clair, et l'accès anonyme reste souvent activé par erreur.
    hint:
      en: Prefer SFTP; if FTP must stay, require TLS (FTPS) and disable anonymous login.
      fr: Préférez SFTP ; si FTP doit rester, exigez TLS (FTPS) et désactivez la connexion anonyme.
    banners: ["220 FTP server ready."]
  - id: vsftpd
    name: vsftpd
    parent: ftp
    products: [vsftpd]
    banners: ["220 (vsFTPd 3.0.3)"]
  - id: proftpd
    name: ProFTPD
    parent: ftp
    products: [proftpd]
    banners: ["220 ProFTPD Server (Debian) [::ffff:192.0.2.10]"]
  - id: pure-ftpd
    name: Pure-FTPd
    parent: ftp
    products: [pure-ftpd, pureftpd]
    banners: ["220---------- Welcome to Pure-FTPd [privsep] [TLS] ----------"]
  - id: filezilla-ftp
    name: FileZilla Server
    parent: ftp
    products: [filezilla server, filezilla-ftp, filezilla]
  - id: microsoft-ftpd
    name: Microsoft FTP Service
    parent: ftp
    products: [microsoft-ftpd, ftp service, iis ftp]
    banners: ["220 Microsoft FTP Service"]

  - id: smb
    name: SMB (Windows file sharing)
    name_fr: SMB (partage Windows)
    parent: windows-network
    ports: [445]
    aliases: [microsoft-ds, smb, smb2]
    risk: critical
    what:
      en: Windows file and printer sharing.
      fr: Partage de fichiers et d'imprimantes Windows.
    why:
      en: SMB on the internet is how WannaCry and NotPetya spread; it should never leave the local network.
      fr: C'est par SMB exposé que WannaCry et NotPetya se sont propagés ; il ne doit jamais sortir du réseau local.
  - id: netbios
    name: NetBIOS session
    name_fr: Session NetBIOS
    parent: windows-network
    ports: [139]
    aliases: [netbios-ssn]
    what:
      en: Legacy Windows file sharing transport.
      fr: Ancien transport du partage de fichiers Windows.
  - id: msrpc
    name: Microsoft RPC
    parent: windows-network
    ports: [135]
    aliases: [msrpc, epmap]
    what:
      en: Windows remote procedure call endpoint mapper.
      fr: Répartiteur d'appels de procédure à distance de Windows.

  - id: nfs
    name: NFS
    category: file-transfer
    ports: [2049]
    exposure: private
    risk: high
    what:
      en: Network file system shares.
      fr: Partages de fichiers réseau NFS.
    why:
      en: NFS trusts the client's claimed identity; a share open to the internet can be mounted and read by anyone.
      fr: NFS fait confiance à l'identité déclarée par le client ; un partage ouvert sur Internet peut être monté et lu par n'importe qui.
    hint:
      en: Export shares only to the client addresses that need them (/etc/exports) and block 2049 and 111 at the firewall.
      fr: N'exportez les partages qu'aux adresses clientes concernées (/etc/exports) et bloquez 2049 et 111 au pare-feu.
  - id: rpcbind
    name: rpcbind / portmapper
    category: file-transfer
    ports: [111]
    aliases: [rpcbind, portmapper, sunrpc]
    exposure: private
    risk: medium
    what:
      en: Directory of the machine's RPC services (NFS and others).
      fr: Annuaire des services RPC de la machine (NFS et autres).
    why:
      en: It lists internal services to anyone and has been used for traffic amplification attacks.
      fr: Il liste les services internes à n'importe qui et a servi à des attaques par amplification.
    hint:
      en: Block port 111 from the internet, or stop rpcbind if you do not use NFS.
      fr: Bloquez le port 111 depuis Internet, ou arrêtez rpcbind si vous n'utilisez pas NFS.
  - id: rsync
    name: rsync daemon
    name_fr: Démon rsync
    category: file-transfer
    ports: [873]
    exposure: private
    risk: high
    what:
      en: File synchronisation daemon.
      fr: Démon de synchronisation de fichiers.
    why:
      en: rsync modules are often readable or even writable without a password.
      fr: Les modules rsync sont souvent lisibles, voire modifiables, sans mot de passe.
    hint:
      en: Run rsync over SSH instead of the daemon, or require auth users and hosts allow in rsyncd.conf.
      fr: Utilisez rsync par SSH plutôt que le démon, ou exigez auth users et hosts allow dans rsyncd.conf.
    banners: ["@RSYNCD: 31.0", "@RSYNCD: 30.0"]

  # --------------------------------------------------------------------- web
  - id: http
    name: Web server (HTTP)
    name_fr: Serveur web (HTTP)
    category: web
    ports: [80]
    aliases: [http, www]
    exposure: public
    risk: info
    what:
      en: Website or web application, without encryption.
      fr: Site ou application web, sans chiffrement.
    why:
      en: Normal for a website, but plain HTTP should only redirect to HTTPS.
      fr: Normal pour un site, mais le HTTP simple ne devrait servir qu'à rediriger vers HTTPS.
    hint:
      en: Redirect every request to HTTPS and add Strict-Transport-Security.
      fr: Redirigez toutes les requêtes vers HTTPS et ajoutez Strict-Transport-Security.
  - id: https
    name: Web server (HTTPS)
    name_fr: Serveur web (HTTPS)
    category: web
    ports: [443]
    aliases: [https, ssl/http, http-tls]
    exposure: public
    risk: info
    what:
      en: Website or web application over TLS.
      fr: Site ou application web chiffré par TLS.
    why:
      en: Normal for a website; what matters is the TLS configuration and the software version behind it.
      fr: Normal pour un site ; ce qui compte, c'est la configuration TLS et la version du logiciel derrière.
  - id: http-alt
    name: Web service on an alternate port
    parent: http
    name_fr: Service web sur un port alternatif
    category: web
    ports: [8080, 8000, 8008, 8081, 8888, 8443]
    aliases: [http-proxy, http-alt, https-alt]
    exposure: restricted
    risk: low
    what:
      en: Web service on a non-standard port, often a development server or an admin tool.
      fr: Service web sur un port non standard, souvent un serveur de développement ou un outil d'administration.
    why:
      en: Alternate ports often host tools that were never meant to be public.
      fr: Les ports alternatifs hébergent souvent des outils qui n'étaient pas prévus pour être publics.
    hint:
      en: Check what runs there; publish it through your main reverse proxy on 443, or limit it to known addresses.
      fr: Vérifiez ce qui tourne là ; publiez-le via votre reverse proxy principal sur 443, ou limitez-le à des adresses connues.
  - id: nginx
    name: nginx
    parent: http
    products: [nginx]
    banners: ["nginx/1.24.0 (Ubuntu)", "nginx/1.26.3", "nginx"]
  - id: apache
    name: Apache httpd
    parent: http
    products: [apache, apache httpd, httpd]
    banners: ["Apache/2.4.62 (Debian)", "Apache/2.4.58 (Ubuntu)", "Apache"]
  - id: iis
    name: Microsoft IIS
    parent: http
    products: [iis, microsoft-iis, internet information services]
    banners: ["Microsoft-IIS/10.0"]
  - id: caddy
    name: Caddy
    parent: http
    products: [caddy]
    banners: ["Caddy"]
  - id: lighttpd
    name: lighttpd
    parent: http
    products: [lighttpd]
  - id: litespeed
    name: LiteSpeed
    parent: http
    products: [litespeed, openlitespeed]
    banners: ["LiteSpeed"]
  - id: cloudflare
    name: Cloudflare
    parent: https
    products: [cloudflare]
    banners: ["cloudflare"]
    what:
      en: Cloudflare edge server in front of the real host.
      fr: Serveur Cloudflare placé devant la vraie machine.
  - id: squid
    name: Squid proxy
    name_fr: Proxy Squid
    category: web
    ports: [3128]
    products: [squid]
    exposure: private
    risk: high
    what:
      en: HTTP proxy.
      fr: Proxy HTTP.
    why:
      en: An open proxy lets anyone relay attacks and spam through your address, and may reach your internal network.
      fr: Un proxy ouvert permet à n'importe qui de faire passer attaques et spam par votre adresse, et peut atteindre votre réseau interne.
    hint:
      en: Restrict http_access to your own networks.
      fr: Limitez http_access à vos propres réseaux.
    banners: ["squid/6.10", "squid/5.7"]
  - id: socks
    name: SOCKS proxy
    name_fr: Proxy SOCKS
    category: web
    ports: [1080]
    exposure: private
    risk: high
    what:
      en: SOCKS proxy.
      fr: Proxy SOCKS.
    why:
      en: An open proxy lets anyone relay traffic through your address, and may reach your internal network.
      fr: Un proxy ouvert permet à n'importe qui de faire passer du trafic par votre adresse, et peut atteindre votre réseau interne.

  # -------------------------------------------------------------------- mail
  - id: smtp
    name: Mail server (SMTP)
    name_fr: Serveur de mail (SMTP)
    category: mail
    ports: [25]
    exposure: public
    risk: info
    what:
      en: Receives email for your domains.
      fr: Reçoit le courrier électronique de vos domaines.
    why:
      en: Normal on a mail server; elsewhere, an SMTP port usually means a mail daemon that should listen locally only.
      fr: Normal sur un serveur de mail ; ailleurs, un port SMTP signale souvent un démon qui ne devrait écouter qu'en local.
    hint:
      en: If this machine is not your mail server, set inet_interfaces = loopback-only (Postfix) or the equivalent.
      fr: Si cette machine n'est pas votre serveur de mail, réglez inet_interfaces = loopback-only (Postfix) ou l'équivalent.
    banners: ["220 mail.example.com ESMTP"]
  - id: smtp-submission
    name: Mail submission
    name_fr: Envoi de mail
    parent: smtp
    ports: [587, 465]
    aliases: [submission, smtps, submissions]
    what:
      en: Lets your users send email through the server.
      fr: Permet à vos utilisateurs d'envoyer du courrier via le serveur.
  - id: postfix
    name: Postfix
    parent: smtp
    products: [postfix]
    banners: ["220 mail.example.com ESMTP Postfix (Debian/GNU)"]
  - id: exim
    name: Exim
    parent: smtp
    products: [exim]
    banners: ["220 mx.example.com ESMTP Exim 4.97 Mon, 24 Nov 2026 10:00:00 +0000"]
  - id: sendmail
    name: Sendmail
    parent: smtp
    products: [sendmail]
  - id: microsoft-esmtp
    name: Microsoft Exchange SMTP
    parent: smtp
    products: [microsoft-esmtp, exchange server, microsoft exchange, exchange]
    banners: ["220 mail.example.com Microsoft ESMTP MAIL Service ready"]
  - id: pop3
    name: POP3 (clear text)
    name_fr: POP3 (en clair)
    category: mail
    ports: [110]
    exposure: restricted
    risk: medium
    insecure: true
    what:
      en: Mailbox download without encryption.
      fr: Relève du courrier sans chiffrement.
    why:
      en: Passwords and emails can travel in clear text.
      fr: Mots de passe et messages peuvent circuler en clair.
    hint:
      en: Offer only POP3S on 995 (or require STARTTLS) and close 110.
      fr: Ne proposez que POP3S sur 995 (ou exigez STARTTLS) et fermez le 110.
    banners: ["+OK Dovecot (Debian) ready.", "+OK POP3 server ready"]
  - id: imap
    name: IMAP (clear text)
    name_fr: IMAP (en clair)
    category: mail
    ports: [143]
    exposure: restricted
    risk: medium
    insecure: true
    what:
      en: Mailbox access without encryption.
      fr: Accès aux boîtes mail sans chiffrement.
    why:
      en: Passwords and emails can travel in clear text.
      fr: Mots de passe et messages peuvent circuler en clair.
    hint:
      en: Offer only IMAPS on 993 (or require STARTTLS) and close 143.
      fr: Ne proposez que IMAPS sur 993 (ou exigez STARTTLS) et fermez le 143.
    banners: ["* OK IMAP4rev1 server ready"]
  - id: mail-tls
    name: Mailbox access over TLS
    name_fr: Accès aux boîtes mail en TLS
    category: mail
    ports: [993, 995]
    aliases: [imaps, pop3s]
    exposure: public
    risk: info
    what:
      en: Encrypted mailbox access (IMAPS / POP3S).
      fr: Accès chiffré aux boîtes mail (IMAPS / POP3S).
    why:
      en: Normal on a mail server.
      fr: Normal sur un serveur de mail.
  - id: dovecot
    name: Dovecot
    parent: imap
    products: [dovecot]
    banners: ["* OK [CAPABILITY IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE LITERAL+ STARTTLS AUTH=PLAIN] Dovecot (Debian) ready."]
  - id: courier
    name: Courier
    parent: imap
    products: [courier, courier-imap]

  # --------------------------------------------------------------------- dns
  - id: dns
    name: DNS
    category: dns
    ports: [53]
    aliases: [domain, dns]
    exposure: restricted
    risk: low
    what:
      en: Name server.
      fr: Serveur de noms.
    why:
      en: Normal for an authoritative server; a resolver open to everyone is used for amplification attacks.
      fr: Normal pour un serveur faisant autorité ; un résolveur ouvert à tous sert aux attaques par amplification.
    hint:
      en: If this is a resolver, answer recursive queries only for your own networks (allow-recursion in BIND).
      fr: S'il s'agit d'un résolveur, ne répondez aux requêtes récursives que pour vos réseaux (allow-recursion dans BIND).

  # --------------------------------------------------------------- databases
  - id: mysql
    name: MySQL / MariaDB
    parent: database
    ports: [3306]
    aliases: [mysql]
    products: [mysql]
    what:
      en: SQL database.
      fr: Base de données SQL.
    hint:
      en: Set bind-address = 127.0.0.1 in my.cnf, or block 3306 at the firewall.
      fr: Réglez bind-address = 127.0.0.1 dans my.cnf, ou bloquez le 3306 au pare-feu.
    banners: ["8.0.39-0ubuntu0.24.04.2", "5.7.44-log"]
  - id: mariadb
    name: MariaDB
    parent: mysql
    products: [mariadb]
    banners: ["11.4.5-MariaDB-1:11.4.5+maria~ubu2404", "10.11.11-MariaDB-0+deb12u1"]
  - id: postgresql
    name: PostgreSQL
    parent: database
    ports: [5432]
    aliases: [postgresql, postgres]
    products: [postgresql, postgres]
    what:
      en: SQL database.
      fr: Base de données SQL.
    hint:
      en: Set listen_addresses = 'localhost' in postgresql.conf and limit pg_hba.conf to known networks.
      fr: Réglez listen_addresses = 'localhost' dans postgresql.conf et limitez pg_hba.conf aux réseaux connus.
  - id: mssql
    name: Microsoft SQL Server
    parent: database
    ports: [1433]
    aliases: [ms-sql-s, mssql]
    products: [microsoft sql server, mssql]
    what:
      en: SQL database.
      fr: Base de données SQL.
  - id: oracle
    name: Oracle Database listener
    name_fr: Écouteur Oracle Database
    parent: database
    ports: [1521]
    aliases: [oracle, oracle-tns]
    what:
      en: Oracle database listener.
      fr: Écouteur de la base de données Oracle.
  - id: mongodb
    name: MongoDB
    parent: database
    ports: [27017, 27018]
    aliases: [mongodb, mongod]
    products: [mongodb]
    risk: critical
    what:
      en: Document database.
      fr: Base de données orientée documents.
    why:
      en: Thousands of exposed MongoDB servers have been emptied and held for ransom; old versions had no authentication by default.
      fr: Des milliers de MongoDB exposés ont été vidés puis rançonnés ; les anciennes versions n'avaient aucune authentification par défaut.
    hint:
      en: Set net.bindIp to 127.0.0.1 (or the private address) and enable security.authorization.
      fr: Réglez net.bindIp sur 127.0.0.1 (ou l'adresse privée) et activez security.authorization.
  - id: redis
    name: Redis
    parent: database
    ports: [6379]
    aliases: [redis]
    products: [redis]
    risk: critical
    what:
      en: In-memory database and cache.
      fr: Base de données et cache en mémoire.
    why:
      en: Redis often has no password; anyone who reaches it can read your data and, through its configuration commands, run code on the server.
      fr: Redis n'a souvent pas de mot de passe ; quiconque l'atteint peut lire vos données et, via ses commandes de configuration, exécuter du code sur le serveur.
    hint:
      en: In redis.conf set bind 127.0.0.1 ::1, protected-mode yes, and a requirepass (or ACL users).
      fr: Dans redis.conf, mettez bind 127.0.0.1 ::1, protected-mode yes et un requirepass (ou des utilisateurs ACL).
    banners: ["-NOAUTH Authentication required.", "-DENIED Redis is running in protected mode because protected mode is enabled", "$3755 # Server redis_version:7.2.4"]
  - id: memcached
    name: Memcached
    parent: database
    ports: [11211]
    aliases: [memcached, memcache]
    products: [memcached]
    what:
      en: In-memory cache.
      fr: Cache en mémoire.
    why:
      en: Memcached has no authentication; anyone can read the cache, and exposed servers were used for record-size amplification attacks.
      fr: Memcached n'a pas d'authentification ; n'importe qui peut lire le cache, et des serveurs exposés ont servi à des attaques par amplification record.
    hint:
      en: Start it with -l 127.0.0.1 -U 0 (listen locally, UDP off).
      fr: Lancez-le avec -l 127.0.0.1 -U 0 (écoute locale, UDP désactivé).
    banners: ["VERSION 1.6.21", "VERSION 1.6.29"]
  - id: elasticsearch
    name: Elasticsearch
    parent: database
    ports: [9200, 9300]
    aliases: [elasticsearch, wap-wsp]
    products: [elasticsearch]
    risk: critical
    what:
      en: Search engine and document store.
      fr: Moteur de recherche et stockage de documents.
    why:
      en: Exposed Elasticsearch clusters are behind many large data leaks; versions before 8 have security off by default.
      fr: Des Elasticsearch exposés sont à l'origine de nombreuses fuites massives ; avant la version 8, la sécurité est désactivée par défaut.
    hint:
      en: "Set network.host to a private address and keep xpack.security.enabled: true."
      fr: "Réglez network.host sur une adresse privée et gardez xpack.security.enabled: true."
  - id: couchdb
    name: CouchDB
    parent: database
    ports: [5984]
    products: [couchdb]
    what:
      en: Document database with an HTTP API.
      fr: Base de données de documents avec une API HTTP.
    banners: ["CouchDB/3.3.3 (Erlang OTP/25)"]
  - id: cassandra
    name: Cassandra
    parent: database
    ports: [9042, 7000]
    what:
      en: Distributed database.
      fr: Base de données distribuée.
  - id: influxdb
    name: InfluxDB
    parent: database
    ports: [8086]
    products: [influxdb]
    what:
      en: Time-series database.
      fr: Base de données de séries temporelles.
  - id: clickhouse
    name: ClickHouse
    parent: database
    ports: [8123, 9000]
    products: [clickhouse]
    what:
      en: Analytics database.
      fr: Base de données analytique.
  - id: neo4j
