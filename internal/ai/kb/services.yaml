      fr: Un point d'entrée VPN est fait pour être joignable ; gardez-le à jour.
  - id: wireguard
    name: WireGuard
    category: vpn
    udp: [51820]
    exposure: public
    risk: info
    what:
      en: VPN endpoint.
      fr: Point d'entrée VPN.
    why:
      en: WireGuard answers nothing to unauthenticated packets; exposing it is safe by design.
      fr: WireGuard ne répond rien aux paquets non authentifiés ; l'exposer est sûr par conception.
  - id: sip
    name: SIP (VoIP)
    name_fr: SIP (téléphonie IP)
    category: voice
    ports: [5060, 5061]
    udp: [5060]
    exposure: restricted
    risk: medium
    what:
      en: Voice over IP signalling.
      fr: Signalisation de la voix sur IP.
    why:
      en: Exposed SIP servers are scanned for weak extension passwords to place fraudulent paid calls.
      fr: Les serveurs SIP exposés sont scannés à la recherche de mots de passe faibles pour passer des appels frauduleux payants.
  - id: rtsp
    name: RTSP (video streams)
    name_fr: RTSP (flux vidéo)
    category: iot
    ports: [554, 8554]
    exposure: private
    risk: high
    what:
      en: Video stream server, typically a security camera.
      fr: Serveur de flux vidéo, typiquement une caméra de surveillance.
    why:
      en: Camera streams are often viewable without a password.
      fr: Les flux des caméras sont souvent visibles sans mot de passe.

