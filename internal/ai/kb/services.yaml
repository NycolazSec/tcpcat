    banners: ['INFO {"server_id":"NB2X","server_name":"nats","version":"2.10.22","proto":1,"go":"go1.23.4","host":"0.0.0.0","port":4222}']

  # ---------------------------------------------- containers and Kubernetes
  - id: docker-api
    name: Docker Engine API
    name_fr: API du moteur Docker
    parent: cluster
    ports: [2375]
    what:
      en: Docker daemon remote API without TLS.
      fr: API distante du démon Docker, sans TLS.
    why:
      en: The unencrypted Docker API has no authentication; whoever reaches it is root on the host and can start any container.
      fr: L'API Docker non chiffrée n'a pas d'authentification ; quiconque l'atteint est root sur la machine et peut lancer n'importe quel conteneur.
    hint:
      en: Remove -H tcp://0.0.0.0:2375 from the daemon options; use the local socket, or TLS with client certificates on 2376.
      fr: Retirez -H tcp://0.0.0.0:2375 des options du démon ; utilisez le socket local, ou TLS avec certificats clients sur le 2376.
    banners: ['{"Platform":{"Name":"Docker Engine - Community"},"Components":[{"Name":"Engine","Version":"27.3.1"']
  - id: docker-api-tls
    name: Docker Engine API (TLS)
    name_fr: API du moteur Docker (TLS)
    parent: docker-api
    ports: [2376]
    risk: high
    what:
      en: Docker daemon remote API over TLS.
      fr: API distante du démon Docker, en TLS.
    why:
      en: Even with TLS, a client certificate gives root on the host; this API should not face the internet.
      fr: Même avec TLS, un certificat client donne les droits root sur la machine ; cette API ne doit pas faire face à Internet.
  - id: kube-apiserver
    name: Kubernetes API server
    name_fr: Serveur d'API Kubernetes
    parent: cluster
    ports: [6443]
    risk: high
    what:
      en: Kubernetes control plane API (also used by k3s and RKE2).
      fr: API du plan de contrôle Kubernetes (aussi utilisée par k3s et RKE2).
    why:
      en: The API requires credentials, but exposing it invites attacks on any leaked token and on API server flaws.
      fr: L'API exige des identifiants, mais l'exposer invite les attaques sur tout jeton divulgué et sur les failles du serveur d'API.
    banners: ['{"kind":"Status","apiVersion":"v1","metadata":{},"status":"Failure","message":"Unauthorized","reason":"Unauthorized","code":401}', 'forbidden: User "system:anonymous" cannot get path "/"']
  - id: kubelet
    name: Kubelet API
    parent: cluster
    ports: [10250]
    what:
      en: Agent API on every Kubernetes node.
      fr: API de l'agent présent sur chaque nœud Kubernetes.
    why:
      en: A misconfigured kubelet allows anonymous command execution inside every pod of the node.
      fr: Un kubelet mal configuré permet d'exécuter des commandes sans authentification dans tous les pods du nœud.
  - id: kubelet-readonly
    name: Kubelet read-only API
    name_fr: API kubelet en lecture seule
    parent: cluster
    ports: [10255]
    risk: high
    what:
      en: Unauthenticated read-only kubelet API.
      fr: API kubelet en lecture seule, sans authentification.
  - id: etcd
    name: etcd
    parent: cluster
    ports: [2379, 2380]
    products: [etcd]
    what:
      en: Key-value store holding the whole Kubernetes cluster state, secrets included.
      fr: Base clé-valeur qui contient tout l'état du cluster Kubernetes, secrets compris.
    why:
      en: Reading etcd gives every secret of the cluster; writing to it gives full control.
      fr: Lire etcd donne tous les secrets du cluster ; y écrire en donne le contrôle total.
  - id: kube-control-plane
    name: Kubernetes scheduler / controller manager
    name_fr: Ordonnanceur / contrôleur Kubernetes
    parent: cluster
    ports: [10257, 10259]
    risk: high
    what:
      en: Internal Kubernetes control plane components.
      fr: Composants internes du plan de contrôle Kubernetes.
  - id: kube-proxy-health
    name: kube-proxy health
    parent: cluster
    ports: [10256]
    risk: low
    what:
      en: kube-proxy health check endpoint.
      fr: Point de contrôle de santé de kube-proxy.
  - id: spegel
    name: k3s embedded registry (Spegel)
    name_fr: Registre intégré de k3s (Spegel)
    parent: cluster
    ports: [5001]
    risk: medium
    what:
      en: Peer-to-peer image registry mirror used by k3s.
      fr: Miroir de registre d'images en pair à pair utilisé par k3s.
    why:
      en: It lets outsiders pull the container images cached on your nodes, which may contain private code.
      fr: Il permet à des inconnus de télécharger les images de conteneurs en cache sur vos nœuds, qui peuvent contenir du code privé.
  - id: portainer
    name: Portainer
    parent: admin-web
    ports: [9443]
    products: [portainer]
    what:
      en: Web interface to manage Docker and Kubernetes.
      fr: Interface web de gestion de Docker et Kubernetes.

  # ------------------------------------------------------- infrastructure
  - id: consul
    name: HashiCorp Consul
    parent: cluster
    ports: [8500, 8300, 8301]
    risk: high
    what:
