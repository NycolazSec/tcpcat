  - id: node-exporter
    name: Prometheus node exporter
    name_fr: Exporteur de métriques Prometheus
    parent: monitoring
    ports: [9100]
    what:
      en: Host metrics for Prometheus.
      fr: Métriques de la machine pour Prometheus.
  - id: alertmanager
    name: Alertmanager
    parent: monitoring
    ports: [9093]
    what:
      en: Prometheus alert router.
      fr: Routeur d'alertes de Prometheus.
  - id: grafana
    name: Grafana
    parent: monitoring
    ports: [3000]
    exposure: restricted
    products: [grafana]
    what:
      en: Dashboards.
      fr: Tableaux de bord.
    why:
      en: Grafana has a login page, but it holds credentials to your data sources and has had serious flaws.
      fr: Grafana a une page de connexion, mais il détient les accès à vos sources de données et a connu des failles graves.
  - id: kibana
    name: Kibana
    parent: monitoring
    ports: [5601]
    risk: high
    products: [kibana]
    what:
      en: Interface to Elasticsearch data.
      fr: Interface vers les données Elasticsearch.
  - id: snmp
    name: SNMP
    parent: monitoring
    udp: [161]
    risk: high
    insecure: true
    what:
      en: Device management and monitoring protocol.
      fr: Protocole de gestion et de supervision d'équipements.
    why:
      en: SNMP v1/v2c community strings ("public") travel in clear text and can reveal or change the device configuration.
      fr: Les communautés SNMP v1/v2c (« public ») circulent en clair et peuvent révéler ou modifier la configuration de l'équipement.
    hint:
      en: Use SNMPv3 with authentication and allow only your monitoring server.
      fr: Utilisez SNMPv3 avec authentification et n'autorisez que votre serveur de supervision.
  - id: ipmi
    name: IPMI / BMC
    category: administration
    udp: [623]
    ports: [623]
    exposure: private
    risk: critical
    what:
      en: Out-of-band server management (iDRAC, iLO, BMC).
      fr: Gestion hors bande du serveur (iDRAC, iLO, BMC).
    why:
      en: IPMI leaks password hashes by design (RAKP) and gives full control of the hardware, even when the server is off.
      fr: IPMI divulgue des empreintes de mots de passe par conception (RAKP) et donne le contrôle total du matériel, même serveur éteint.
    hint:
      en: Put management interfaces on a separate network that is never routed to the internet.
      fr: Placez les interfaces de gestion sur un réseau séparé, jamais routé vers Internet.

  # ------------------------------------------------------------ admin tools
  - id: webmin
    name: Webmin
    parent: admin-web
    ports: [10000]
    products: [webmin, miniserv]
    what:
      en: Web-based server administration.
      fr: Administration du serveur par le web.
    banners: ["MiniServ/2.105"]
  - id: jenkins
    name: Jenkins
    parent: admin-web
    products: [jenkins]
    what:
      en: Build server.
      fr: Serveur d'intégration continue.
    why:
      en: Jenkins can run arbitrary code by design (script console, jobs); one weak account gives control of your build machines.
      fr: Jenkins peut exécuter du code arbitraire par conception (console de scripts, tâches) ; un seul compte faible donne le contrôle de vos machines de build.
  - id: jupyter
    name: Jupyter
    parent: admin-web
    products: [jupyter, tornadoserver]
    risk: critical
    what:
      en: Notebook server.
      fr: Serveur de notebooks.
    why:
      en: A notebook runs any code typed into it; an exposed Jupyter without a strong token is a remote shell.
      fr: Un notebook exécute tout code saisi ; un Jupyter exposé sans jeton solide est un accès shell à distance.
  - id: ollama
    name: Ollama
    category: ai
    ports: [11434]
    products: [ollama]
    exposure: private
    risk: high
    what:
      en: Local AI model server.
      fr: Serveur de modèles d'IA locaux.
    why:
      en: The Ollama API has no authentication; anyone can use your GPU, download or delete your models.
      fr: L'API d'Ollama n'a pas d'authentification ; n'importe qui peut utiliser votre GPU, télécharger ou supprimer vos modèles.
    hint:
      en: Keep OLLAMA_HOST on 127.0.0.1 and put an authenticating reverse proxy in front if remote access is needed.
      fr: Gardez OLLAMA_HOST sur 127.0.0.1 et placez un reverse proxy avec authentification devant si un accès distant est nécessaire.
    banners: ["Ollama is running"]
  - id: minio
    name: MinIO
    parent: admin-web
    ports: [9001]
    products: [minio]
    risk: medium
    what:
      en: S3-compatible object storage console.
      fr: Console du stockage d'objets compatible S3.
  - id: php-fpm
    name: PHP-FPM (FastCGI)
    category: web
    ports: [9000]
    exposure: private
    risk: critical
    what:
      en: PHP FastCGI process manager.
      fr: Gestionnaire de processus FastCGI pour PHP.
    why:
      en: An exposed FastCGI port lets anyone run PHP code on the server.
      fr: Un port FastCGI exposé permet à n'importe qui d'exécuter du code PHP sur le serveur.
    hint:
      en: Use a Unix socket (listen = /run/php/php-fpm.sock) or listen = 127.0.0.1:9000.
      fr: Utilisez un socket Unix (listen = /run/php/php-fpm.sock) ou listen = 127.0.0.1:9000.

  # ---------------------------------------------------------- VPN and voice
  - id: openvpn
