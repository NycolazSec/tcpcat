      fr: Découverte de services et configuration.
    why:
      en: Without ACLs, Consul's API can register checks that run commands on the agents.
      fr: Sans ACL, l'API de Consul peut enregistrer des contrôles qui exécutent des commandes sur les agents.
  - id: vault
    name: HashiCorp Vault
    category: secrets
    ports: [8200]
    exposure: restricted
    risk: medium
    what:
      en: Secrets manager.
      fr: Gestionnaire de secrets.
    why:
      en: Vault is designed to be reached over TLS, but limiting who can reach it reduces the attack surface on your secrets.
      fr: Vault est conçu pour être joint en TLS, mais limiter qui peut l'atteindre réduit la surface d'attaque sur vos secrets.
  - id: nomad
    name: HashiCorp Nomad
    parent: cluster
    ports: [4646]
    what:
      en: Workload orchestrator.
      fr: Orchestrateur de charges de travail.

