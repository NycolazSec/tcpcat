    ports: [7474, 7687]
    products: [neo4j]
    what:
      en: Graph database.
      fr: Base de données orientée graphe.

  # --------------------------------------------------------------- messaging
  - id: rabbitmq
    name: RabbitMQ
    parent: queue
    ports: [5672, 15672]
    aliases: [amqp]
    products: [rabbitmq]
    what:
      en: Message broker (AMQP) and its management interface.
      fr: Courtier de messages (AMQP) et son interface de gestion.
    hint:
      en: Delete or restrict the default guest user and listen on private addresses only.
      fr: Supprimez ou restreignez l'utilisateur guest par défaut et n'écoutez que sur des adresses privées.
  - id: kafka
    name: Apache Kafka
    parent: queue
    ports: [9092]
    what:
      en: Event streaming platform.
      fr: Plateforme de flux d'événements.
  - id: zookeeper
    name: ZooKeeper
    parent: queue
    ports: [2181]
    what:
      en: Coordination service used by Kafka and other clusters.
      fr: Service de coordination utilisé par Kafka et d'autres clusters.
  - id: mqtt
    name: MQTT
    parent: queue
    ports: [1883]
    insecure: true
    aliases: [mqtt]
    what:
      en: Messaging protocol for connected devices.
      fr: Protocole de messagerie pour objets connectés.
    why:
      en: Unprotected MQTT brokers let anyone read device data and send commands to devices.
      fr: Un courtier MQTT non protégé permet à n'importe qui de lire les données des objets et de leur envoyer des commandes.
    hint:
      en: Disable anonymous access (allow_anonymous false), require TLS on 8883, and restrict it to known clients.
      fr: Désactivez l'accès anonyme (allow_anonymous false), exigez TLS sur le 8883 et limitez-le aux clients connus.
  - id: mqtt-tls
