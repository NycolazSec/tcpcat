name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for cosign keyless signing (OIDC token exchange with Sigstore).
  id-token: write
  # Required to push container images to ghcr.io with the built-in token.
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # cosign signs checksums.txt (keyless); syft generates the SBOMs.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      # Build + push the linux/amd64 and linux/arm64 container images.
      - name: Set up QEMU (arm64 image on an amd64 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment alongside the brews:/aurs: blocks in .goreleaser.yaml once
          # the matching secrets exist (see docs/DISTRIBUTION.md):
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # AUR_KEY: ${{ secrets.AUR_KEY }}

  # macOS installers (.dmg + .pkg). The build cross-compiles both
  # architectures and merges them with lipo, so any macOS runner will do.
  # macos-latest (arm64) is tried first; GitHub has run out of capacity on it
  # ("The job was not acquired by Runner of type hosted even after multiple
  # attempts", v1.6.0), so when it does not upload the installers the Intel
  # image takes over. A missing installer never fails the release: goreleaser
  # above has already published every archive and Linux package.
  macos-installers:
    needs: goreleaser
    uses: ./.github/workflows/macos-installers.yml
    with:
      tag: ${{ github.ref_name }}
      runner: macos-latest

  macos-installers-fallback:
    needs: [goreleaser, macos-installers]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && needs.macos-installers.outputs.uploaded != 'true' }}
    uses: ./.github/workflows/macos-installers.yml
    with:
      tag: ${{ github.ref_name }}
      runner: macos-15-intel
