name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Check formatting (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Binary Check
        run: go build -v ./cmd/tcpcat

  lint:
    name: Static Analysis (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # G104 (unchecked error on non-critical calls like Close), G115 (int-to-uint
      # truncation in raw packet/binary-protocol construction), G304 (file path
      # from variable) and G404 (math/rand) are expected in a raw-packet scanning
      # CLI: paths and ports come from the operator's own flags rather than
      # untrusted network input, the truncating conversions are bounded/validated
      # protocol field widths, and math/rand only drives non-cryptographic timing
      # jitter and decoy traffic, never a secret or token.
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # G703/G304 (path taint): tcpcat deliberately reads operator-specified
          # file paths (--config, --scope-file, --baseline, -iL). G304 was
          # already excluded for this; G703 is its taint-analysis sibling.
          # exclude-dir testdata/examples: the WASM dissector sources there use
          # //go:wasmimport (GOARCH=wasm only), so they don't type-check under
          # the host toolchain gosec loads. The Go tool skips testdata/ on its
          # own (go build/vet/test ./... ignore it); gosec does not, so it is
          # excluded explicitly here.
          args: "-exclude=G104,G115,G304,G404,G703 -exclude-dir=testdata -exclude-dir=examples -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

      # Run govulncheck directly rather than through golang/govulncheck-action:
      # that action sets up its own Go and caches the module dir, which
      # collided with this job's setup-go cache and failed the step with
      # "tar: Cannot open: File exists" (a cache flake, not a finding).
      # Running it under the job's Go (stable = the newest patched release)
      # also analyzes against the most up-to-date stdlib, which is what avoids
      # the "advisory fixed upstream but we're a patch behind" treadmill.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
