name: CLA Assistant

# Every pull request author must accept CLA.md before the PR can be merged.
# Signatures are recorded in signatures/version1/cla.json on the
# cla-signatures branch, so main's history stays clean.
#
# pull_request_target is required so the action can comment and set a status on
# PRs from forks. It is safe here: the job never checks out or runs PR code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signatures
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 commit: this job has write permissions, so a moved tag must not change what runs.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/NycolazSec/tcpcat/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer owns the copyright already; bots don't author code.
          allowlist: NycolazSec,dependabot[bot],github-actions[bot]
