{% extends "portal/layout.html" %}
{% block title %}Connexion — tcpcat{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <span class="brand">tcpcat<span class="dot">.</span></span>
    <p class="sub">Espace client &amp; administration</p>
    <div class="card">
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" style="width:100%">Se connecter</button>
      </form>
    </div>
    <p class="sub" style="margin-top:1rem;font-size:.72rem">Accès réservé aux clients tcpcat. Besoin d'aide ? <a href="mailto:support@tcpcat.io">support@tcpcat.io</a></p>
  </div>
</div>
{% endblock %}
