{% extends "portal/layout.html" %}
{% block title %}Vérification — tcpcat{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <span class="brand">tcpcat<span class="dot">.</span></span>
    <p class="sub">Double authentification</p>
    <div class="card">
      <form method="post" action="{{ url_for('auth.verify') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="code">Code reçu par e-mail</label>
          <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*"
                 autocomplete="one-time-code" maxlength="6" required autofocus
                 style="letter-spacing:.4em;text-align:center;font-size:1.2rem">
        </div>
        <button type="submit" style="width:100%">Valider</button>
      </form>
      <form method="post" action="{{ url_for('auth.verify') }}" style="margin-top:.8rem">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="resend">
        <button type="submit" class="btn ghost small" style="width:100%">Renvoyer un code</button>
      </form>
    </div>
    <p class="sub" style="margin-top:1rem;font-size:.72rem">Code à 6 chiffres, valable 10 minutes. <a href="{{ url_for('auth.login') }}">Recommencer</a></p>
  </div>
</div>
{% endblock %}
