<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tcpcat — Releases</title>
<meta name="description" content="tcpcat — release notes and version history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #eef1ec;
    --paper-flat: #e6e9e3;
    --card:       #f6f7f3;
    --ink:        #171a17;
    --ink-soft:   #545b52;
    --ink-faint:  #8b9188;
    --rule:       #c6ccc1;
    --rule-strong:#9aa294;
    --stamp:      #9c2b21;
    --wire:       #1f5c6f;
    --tag-add:    #2f6b3a;
    --tag-fix:    #8a5e10;
    --tag-chg:    #1f5c6f;
    --tag-brk:    #9c2b21;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:14px;
    line-height:1.7;
    margin:0;
  }
  .paper-grid{
    background-image:
      linear-gradient(to right, rgba(23,26,23,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(23,26,23,0.045) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .font-display{font-family:'Space Grotesk', 'IBM Plex Mono', monospace;}
  ::selection{background:var(--stamp); color:#fff;}
  header{
    position:sticky; top:0; z-index:10;
    background:var(--paper);
    border-bottom:1.5px solid var(--ink);
  }
  .bar{
    height:56px; display:flex; align-items:center; justify-content:space-between;
    max-width:760px; margin:0 auto; padding:0 24px;
  }
  .brand{font-family:'Space Grotesk', monospace; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); display:flex; align-items:baseline; gap:8px;}
  .brand .dot{color:var(--stamp);}
  .brand .tag{font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:400; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase;}
  a.doclink{color:var(--wire); text-decoration:underline; text-underline-offset:2px; text-decoration-color:rgba(31,92,111,0.4);}
  a.doclink:hover{text-decoration-color:var(--wire);}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}
  main{padding:56px 0 96px;}
  .meta{
    font-size:11px; color:var(--ink-soft);
    display:grid; grid-template-columns:1fr 1fr; gap:2px 32px;
    margin-bottom:40px;
  }
  .meta div:nth-child(even){text-align:right;}
  h1{
    font-family:'Space Grotesk', monospace; font-weight:700;
    font-size:28px; line-height:1.2; margin:0 0 8px;
  }
  .subtitle{color:var(--ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:.12em; margin:0 0 48px;}

  /* timeline */
  .timeline{position:relative; padding-left:0;}
  .release{
    position:relative;
    padding:0 0 44px 0;
    border-left:1.5px solid var(--rule-strong);
    margin-left:6px;
    padding-left:28px;
  }
  .release:last-child{border-left-color:transparent;}
  .release::before{
    content:'';
    position:absolute; left:-6.5px; top:2px;
    width:11px; height:11px; border-radius:50%;
    background:var(--paper); border:2px solid var(--ink);
  }
  .release.latest::before{ background:var(--stamp); border-color:var(--stamp); }

  .rel-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
  .rel-version{font-family:'Space Grotesk', monospace; font-weight:700; font-size:18px;}
  .rel-date{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
  .rel-badge{
    font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    border:1.5px solid var(--stamp); color:var(--stamp);
    padding:2px 7px; transform:rotate(-1deg); font-weight:600;
  }
  .rel-summary{color:var(--ink-soft); font-size:13px; margin:6px 0 14px;}

  .changes{list-style:none; margin:0; padding:0;}
  .changes li{
    display:grid; grid-template-columns:74px 1fr; gap:10px;
    padding:6px 0; border-top:1px solid var(--rule);
    font-size:13px;
  }
  .changes li:first-child{border-top:none;}
  .change-tag{
    font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    font-weight:600; padding-top:2px;
  }
  .change-tag.add{color:var(--tag-add);}
  .change-tag.fix{color:var(--tag-fix);}
  .change-tag.chg{color:var(--tag-chg);}
  .change-tag.brk{color:var(--tag-brk);}
  code{
    font-family:'IBM Plex Mono', monospace; background:var(--card);
    border:1px solid var(--rule); padding:1px 5px; border-radius:2px; font-size:.9em;
  }
  .assets{
    margin-top:16px; padding:14px 16px;
    background:var(--card); border:1px solid var(--rule);
    font-size:12px; color:var(--ink-soft);
  }
  .assets a{color:var(--wire);}

  footer{
    border-top:1.5px solid var(--ink); padding:24px 0 40px;
    font-size:11px; color:var(--ink-faint);
  }
  footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  @media (max-width:640px){
    .meta{grid-template-columns:1fr;}
    .meta div:nth-child(even){text-align:left;}
    h1{font-size:22px;}
    .changes li{grid-template-columns:60px 1fr;}
  }
</style>
</head>
<body class="paper-grid">

  <header>
    <div class="bar">
      <a href="{{ url_for('undex') }}" class="brand">tcpcat<span class="dot">.</span><span class="tag">Releases</span></a>
      <a href="{{ url_for('undex') }}" class="doclink" style="font-size:11px; text-transform:uppercase; letter-spacing:.05em;">← Back</a>
    </div>
  </header>

  <main class="wrap">

    <div class="meta">
      <div>Document type: Release notes</div>
      <div>N. — NycolazSec</div>
      <div>Project: tcpcat</div>
      <div>github.com/NycolazSec/tcpcat/releases</div>
    </div>

    <h1>Releases</h1>
    <p class="subtitle">Version history &amp; changelog — semantic versioning</p>

    <!-- Populated automatically from the GitHub Releases API — see the
         script at the bottom of this page. No manual edits needed here. -->
    <div class="timeline" id="timeline">
      <p id="timeline-status" style="color:var(--ink-faint); font-size:12px;">Loading releases from GitHub…</p>
    </div>

    <noscript>
      <p style="font-size:12px; color:var(--ink-soft);">
        JavaScript is disabled, so this page can't fetch releases automatically. See the
        <a class="doclink" href="https://github.com/NycolazSec/tcpcat/releases" target="_blank">GitHub releases page</a> instead.
      </p>
    </noscript>
  </main>

  <footer>
    <div class="wrap">
      <span>tcpcat — Apache-2.0 license</span>
      <span>Full history: <a class="doclink" href="https://github.com/NycolazSec/tcpcat/releases" target="_blank">github.com/NycolazSec/tcpcat/releases</a></span>
    </div>
  </footer>

  <script>
    (function () {
      const REPO = 'NycolazSec/tcpcat';
      const timeline = document.getElementById('timeline');
      const status = document.getElementById('timeline-status');

      const TYPE_TAG = { feat: 'add', fix: 'fix', perf: 'add', docs: 'chg', ci: 'chg', chore: 'chg', refactor: 'chg', test: 'chg', style: 'chg' };
      const TAG_LABEL = { add: 'Added', fix: 'Fixed', chg: 'Changed', brk: 'Breaking' };

      function parseCommitLine(line) {
        // GoReleaser body lines look like: "* <sha> <commit subject>"
        const withoutSha = line.replace(/^\*\s*[0-9a-f]{7,40}\s+/i, '').replace(/^\*\s*/, '');
        const conv = withoutSha.match(/^([a-zA-Z]+)(\([^)]*\))?(!)?:\s*(.*)$/);
        if (!conv) return { tag: 'chg', text: withoutSha };
        const [, type, , breaking, rest] = conv;
        const tag = breaking ? 'brk' : (TYPE_TAG[type.toLowerCase()] || 'chg');
        return { tag, text: rest || withoutSha };
      }

      function formatDate(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
      }

      function buildCard(release, isLatest) {
        const card = document.createElement('div');
        card.className = 'release' + (isLatest ? ' latest' : '');

        const head = document.createElement('div');
        head.className = 'rel-head';

        const version = document.createElement('span');
        version.className = 'rel-version';
        version.textContent = release.tag_name || release.name || 'untagged';
        head.appendChild(version);

        const date = document.createElement('span');
        date.className = 'rel-date';
        date.textContent = formatDate(release.published_at || release.created_at);
        head.appendChild(date);

        if (isLatest) {
          const badge = document.createElement('span');
          badge.className = 'rel-badge';
          badge.textContent = 'Latest';
          head.appendChild(badge);
        } else if (release.prerelease) {
          const badge = document.createElement('span');
          badge.className = 'rel-badge';
          badge.style.borderColor = 'var(--tag-chg)';
          badge.style.color = 'var(--tag-chg)';
          badge.textContent = 'Pre-release';
          head.appendChild(badge);
        }
        card.appendChild(head);

        const lines = (release.body || '')
          .split('\n')
          .map((l) => l.trim())
          .filter((l) => l.startsWith('*'));

        if (lines.length) {
          const ul = document.createElement('ul');
          ul.className = 'changes';
          lines.forEach((line) => {
            const { tag, text } = parseCommitLine(line);
            const li = document.createElement('li');
            const tagEl = document.createElement('span');
            tagEl.className = 'change-tag ' + tag;
            tagEl.textContent = TAG_LABEL[tag];
            const textEl = document.createElement('span');
            textEl.textContent = text;
            li.appendChild(tagEl);
            li.appendChild(textEl);
            ul.appendChild(li);
          });
          card.appendChild(ul);
        } else if (release.body) {
          const p = document.createElement('p');
          p.className = 'rel-summary';
          p.textContent = release.body;
          card.appendChild(p);
        }

        const assetCount = (release.assets || []).length;
        const assets = document.createElement('div');
        assets.className = 'assets';
        assets.textContent = assetCount
          ? assetCount + ' build asset' + (assetCount === 1 ? '' : 's') + ' available — '
          : '';
        const link = document.createElement('a');
        link.href = release.html_url;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = 'View on GitHub';
        assets.appendChild(link);
        card.appendChild(assets);

        return card;
      }

      fetch('https://api.github.com/repos/' + REPO + '/releases', {
        headers: { Accept: 'application/vnd.github+json' },
      })
        .then((res) => {
          if (!res.ok) throw new Error('GitHub API responded with ' + res.status);
          return res.json();
        })
        .then((releases) => {
          if (!Array.isArray(releases) || releases.length === 0) {
            throw new Error('no releases published yet');
          }
          timeline.innerHTML = '';
          releases.forEach((release, i) => timeline.appendChild(buildCard(release, i === 0)));
        })
        .catch((err) => {
          status.textContent = 'Could not load releases automatically (' + err.message + '). ';
          const link = document.createElement('a');
          link.className = 'doclink';
          link.href = 'https://github.com/' + REPO + '/releases';
          link.target = '_blank';
          link.textContent = 'See the full list on GitHub →';
          status.appendChild(link);
        });
    })();
  </script>

</body>
</html>
