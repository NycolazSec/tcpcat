<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Source of static/og.png (the Open Graph / Twitter card image). Social
       platforms don't accept SVG, so edit this file and re-render it to a
       1200x630 PNG with the site's fonts (IBM Plex Mono, Space Grotesk)
       loaded, e.g. through a headless browser screenshot. -->
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 V28 M0 28 H28" fill="none" stroke="#171a17" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#eef1ec"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="'IBM Plex Mono', monospace" font-size="20" fill="#626860">
    <text x="80" y="72">Technical Note 1337 · open source · Apache-2.0</text>
    <text x="1120" y="72" text-anchor="end">github.com/NycolazSec/tcpcat</text>
  </g>
  <line x1="80" y1="96" x2="1120" y2="96" stroke="#171a17" stroke-width="2"/>

  <!-- the favicon mark, scaled up -->
  <g transform="translate(80 170) scale(4.3)">
    <rect x="2" y="2" width="60" height="60" rx="13" fill="#f6f7f3" stroke="#9c2b21" stroke-width="2.4"/>
    <path d="M15 47 C15 55 49 55 49 47 L49 25 L46 11 L36 19 L28 19 L18 11 L15 25 Z" fill="none" stroke="#9c2b21" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="25" cy="33" r="3.4" fill="#2f6b3a"/>
    <circle cx="39" cy="33" r="3.4" fill="#2f6b3a"/>
    <path d="M29.5 40 H34.5 L32 43 Z" fill="#9c2b21"/>
  </g>

  <text x="420" y="268" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="128" fill="#171a17">tcpcat<tspan fill="#9c2b21">.</tspan></text>
  <text x="424" y="324" font-family="'IBM Plex Mono', monospace" font-size="28" fill="#484e46">High-performance network reconnaissance</text>
  <text x="424" y="366" font-family="'IBM Plex Mono', monospace" font-size="24" fill="#1f5c6f">eBPF · AF_XDP · Go · CVE correlation</text>

  <g transform="rotate(-2 640 450)">
    <rect x="424" y="410" width="520" height="76" fill="none" stroke="#9c2b21" stroke-width="3"/>
    <text x="684" y="460" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="36" fill="#9c2b21">2.62× faster than Nmap</text>
  </g>
  <text x="424" y="530" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#626860">SYN scan · 65,535 ports × 2 hosts · hyperfine, 3 runs</text>

  <line x1="80" y1="570" x2="1120" y2="570" stroke="#9aa294" stroke-width="1.5"/>
  <text x="80" y="604" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="22" fill="#171a17">tcpcat.io</text>
  <text x="1120" y="604" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#9c2b21">AUTHORIZED USE ONLY</text>
</svg>
