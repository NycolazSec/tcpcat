version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tcpcat
    main: ./cmd/tcpcat
    binary: tcpcat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSE-Apache-2.0.txt
      - COMMERCIAL-LICENSE.md
      - NOTICE
      - NOTICE.md
      - docs/*

nfpms:
  - id: packages
    package_name: tcpcat
    vendor: NycolazSec
    homepage: https://tcpcat.io
    maintainer: NycolazSec <support@tcpcat.io>
    description: High-Performance Network Reconnaissance & Vulnerability Intelligence Engine
    license: AGPL-3.0-only
    formats:
      - deb
      - rpm
    bindir: /usr/bin

# ---------------------------------------------------------------------------
# Container images -> GitHub Container Registry (ghcr.io).
# Works with the built-in GITHUB_TOKEN; the release workflow logs in to ghcr
# and sets up QEMU/buildx so the arm64 image can be built on an amd64 runner.
# After the first release, flip the package to public once in the repo's
# Packages settings so `docker pull` needs no auth.
# ---------------------------------------------------------------------------
dockers:
  - id: tcpcat-amd64
    goos: linux
    goarch: amd64
    dockerfile: packaging/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/nycolazsec/tcpcat:{{ .Version }}-amd64"
      - "ghcr.io/nycolazsec/tcpcat:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/NycolazSec/tcpcat"
      - "--label=org.opencontainers.image.url=https://tcpcat.io"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"
  - id: tcpcat-arm64
    goos: linux
    goarch: arm64
    dockerfile: packaging/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/nycolazsec/tcpcat:{{ .Version }}-arm64"
      - "ghcr.io/nycolazsec/tcpcat:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/NycolazSec/tcpcat"
      - "--label=org.opencontainers.image.url=https://tcpcat.io"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"

docker_manifests:
  - name_template: "ghcr.io/nycolazsec/tcpcat:{{ .Version }}"
    image_templates:
      - "ghcr.io/nycolazsec/tcpcat:{{ .Version }}-amd64"
      - "ghcr.io/nycolazsec/tcpcat:{{ .Version }}-arm64"
  - name_template: "ghcr.io/nycolazsec/tcpcat:latest"
    image_templates:
      - "ghcr.io/nycolazsec/tcpcat:latest-amd64"
      - "ghcr.io/nycolazsec/tcpcat:latest-arm64"

# ---------------------------------------------------------------------------
# Homebrew tap  ->  `brew install nycolazsec/tap/tcpcat`
# Prerequisites (one-time), see docs/DISTRIBUTION.md:
#   1. Create a PUBLIC repo  NycolazSec/homebrew-tap
#   2. Create a fine-grained PAT with Contents:write on that repo and add it to
#      THIS repo as the secret HOMEBREW_TAP_GITHUB_TOKEN
#      (the default GITHUB_TOKEN cannot push to another repo)
#   3. Uncomment this block and the matching step in .github/workflows/release.yml
# brews:
#   - name: tcpcat
#     repository:
#       owner: NycolazSec
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     homepage: "https://tcpcat.io"
#     description: "Fast network scanner in Go with an eBPF/AF_XDP engine, service/OS detection and CVE correlation"
#     license: "AGPL-3.0-only"
#     commit_author:
#       name: NycolazSec
#       email: support@tcpcat.io
#     test: |
#       system "#{bin}/tcpcat", "--help"

# ---------------------------------------------------------------------------
# Arch User Repository  ->  `yay -S tcpcat-bin`
# Prerequisites (one-time), see docs/DISTRIBUTION.md:
#   1. Register the tcpcat-bin package name on aur.archlinux.org
#   2. Add your AUR SSH private key as the secret AUR_KEY in this repo
#   3. Uncomment this block and the matching step in .github/workflows/release.yml
# aurs:
#   - name: tcpcat-bin
#     homepage: "https://tcpcat.io"
#     description: "Fast network scanner in Go with an eBPF/AF_XDP engine, service/OS detection and CVE correlation"
#     maintainers:
#       - "NycolazSec <support@tcpcat.io>"
#     license: "AGPL-3.0-only"
#     private_key: "{{ .Env.AUR_KEY }}"
#     git_url: "ssh://aur@aur.archlinux.org/tcpcat-bin.git"
#     depends:
#       - iputils

release:
  # "auto" marks the GitHub release as a pre-release whenever the tag has a
  # semver pre-release suffix (e.g. v1.1.0-beta.1), and as a full release
  # otherwise -- so a beta tag ships as a pre-release without any further
  # config, and a later stable tag needs no change here.
  prerelease: auto

checksum:
  name_template: "checksums.txt"

# Generate a CycloneDX SBOM (via syft) for every release archive, so consumers
# and supply-chain scanners get a full dependency inventory per artifact.
sboms:
  - artifacts: archive

# Sign the checksums file with cosign in keyless mode: the signature is tied to
# the GitHub Actions OIDC identity (no long-lived private key to manage) and
# recorded in the public Rekor transparency log. Because checksums.txt lists
# the SHA-256 of every archive/package, signing it cryptographically covers the
# whole release. Verify with:
#   cosign verify-blob \
#     --certificate checksums.txt.pem \
#     --signature  checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/NycolazSec/tcpcat/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request