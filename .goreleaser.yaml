version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tcpcat
    main: ./cmd/tcpcat
    binary: tcpcat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSE-Apache-2.0.txt
      - COMMERCIAL-LICENSE.md
      - NOTICE
      - NOTICE.md
      - docs/*

nfpms:
  - id: packages
    package_name: tcpcat
    vendor: NycolazSec
    homepage: https://tcpcat.io
    maintainer: NycolazSec <support@tcpcat.io>
    description: High-Performance Network Reconnaissance & Vulnerability Intelligence Engine
    license: AGPL-3.0-only
    formats:
      - deb
      - rpm
    bindir: /usr/bin

release:
  # "auto" marks the GitHub release as a pre-release whenever the tag has a
  # semver pre-release suffix (e.g. v1.1.0-beta.1), and as a full release
  # otherwise -- so a beta tag ships as a pre-release without any further
  # config, and a later stable tag needs no change here.
  prerelease: auto

checksum:
  name_template: "checksums.txt"

# Generate a CycloneDX SBOM (via syft) for every release archive, so consumers
# and supply-chain scanners get a full dependency inventory per artifact.
sboms:
  - artifacts: archive

# Sign the checksums file with cosign in keyless mode: the signature is tied to
# the GitHub Actions OIDC identity (no long-lived private key to manage) and
# recorded in the public Rekor transparency log. Because checksums.txt lists
# the SHA-256 of every archive/package, signing it cryptographically covers the
# whole release. Verify with:
#   cosign verify-blob \
#     --certificate checksums.txt.pem \
#     --signature  checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/NycolazSec/tcpcat/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request